# Docker Compose para Le Brunch App
# Este archivo define los servicios necesarios para la aplicación:
# - db: Base de datos PostgreSQL
# - server: Servidor Node.js con la API
# - app: Aplicación web Flutter

services:
  db:
    image: postgres:15
    container_name: lebrunch_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: monito
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - lebrunch_network

  server:
    build:
      context: .
      dockerfile: server.Dockerfile
    container_name: lebrunch_server
    depends_on:
      - db
    environment:
      - NODE_SERVER_IP=server
      - NODE_SERVER_PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=monito
      - DB_NAME=postgres
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/usr/src/app/uploads
    restart: unless-stopped
    networks:
      - lebrunch_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lebrunch_app
    depends_on:
      - server
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - lebrunch_network

networks:
  lebrunch_network:
    driver: bridge

volumes:
  postgres_data:
