name: le_brunch_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.0.0
  file_picker: ^9.1.0
  http: ^1.2.2
  flutter_image_compress: ^2.3.0
  image: ^4.4.0
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2
  jwt_decoder: ^2.0.1
  permission_handler: ^11.4.0
  image_picker: ^1.1.2
  cached_network_image: ^3.2.3
  intl: ^0.20.2
  curved_navigation_bar: ^1.0.6
  uuid: ^4.5.1
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^5.1.0
  calendar_date_picker2: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/fondo-flores-2.png
    - assets/logos/
    - assets/fonts/
    - .env
  fonts:
    - family: LightHouse
      fonts:
        - asset: assets/fonts/LightHouse-Regular.ttf
    - family: MADE TOMMY
      fonts:
        - asset: assets/fonts/MADE-TOMMY-Regular.otf
        - asset: assets/fonts/MADE-TOMMY-Bold.otf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/logo.png"
  remove_alpha_ios: true
  image_size_android: 0.22
  image_size_ios: 0.22
  padding_android: 20
  min_sdk_android: 21
